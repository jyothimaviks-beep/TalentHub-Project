<template>
    <lightning-card title="TalentHub Application Demo" icon-name="standard:job_application">

        <div class="slds-p-around_medium">

            <lightning-input type="text" label="Candidate ID" placeholder="Enter Candidate Record ID"
                value={candidateId} onchange={handleCandidateChange}>
            </lightning-input>

            <lightning-input type="text" label="Job ID" placeholder="Enter Job Record ID" value={jobId}
                onchange={handleJobChange} class="slds-m-top_medium">
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button label="Submit Application" variant="brand" onclick={handleSubmit}
                    disabled={isLoading}>
                </lightning-button>
            </div>

            <template if:true={isLoading}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Submitting application" size="small">
                    </lightning-spinner>
                </div>
            </template>

            <template if:true={message}>
                <div class="slds-m-top_medium">
                    <div class={messageClass}>
                        {message}
                    </div>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
