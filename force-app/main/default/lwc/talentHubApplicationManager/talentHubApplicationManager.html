<template>
    <lightning-card title="TalentHub Application Manager" icon-name="standard:record">

        <div class="slds-p-around_medium">

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading applications" size="medium">
                </lightning-spinner>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-p-around_small">
                    {errorMessage}
                </div>
            </template>

            <template if:true={hasApplications}>
                <lightning-datatable key-field="Id" data={applications} columns={columns} hide-checkbox-column>
                </lightning-datatable>
            </template>

            <template if:true={showEmpty}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    No job applications found.
                </div>
            </template>

            <template if:true={selectedApplication}>
                <div class="slds-m-top_large">

                    <h3 class="slds-text-heading_medium">
                        Update Application
                    </h3>

                    <lightning-combobox label="Application Status" value={status} options={statusOptions}
                        onchange={handleStatusChange}>
                    </lightning-combobox>

                    <lightning-input type="date" label="Interview Date" value={interviewDate}
                        onchange={handleDateChange}>
                    </lightning-input>

                    <lightning-button label="Save Changes" variant="brand" class="slds-m-top_medium"
                        onclick={handleSave}>
                    </lightning-button>

                </div>
            </template>

        </div>
    </lightning-card>
</template>
